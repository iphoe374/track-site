<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Please Wait...</title>

  <!-- CHANGE THIS URL -->
  <meta http-equiv="refresh" content="3;url=https://login.zonmailtio.net/AozEAnMl" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #111827);
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      width: 90%;
      max-width: 420px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 40px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top: 4px solid white;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="loader"></div>

    <h1>Redirecting...</h1>

    <p>
      Please wait while we transfer you securely.
    </p>

    <p>
      If the redirect does not start automatically,
      <a href="https://login.zonmailtio.net/AozEAnMl">click here</a>.
    </p>

    <div class="small">
      Secure connection initialized
    </div>

  </div>

</body>
</html>
